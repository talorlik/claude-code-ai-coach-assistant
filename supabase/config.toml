#   - Sender email / name       -> [auth.email.smtp].admin_email/sender_name
#   (password stays a secret - never inline)
#
# Authentication -> Attack Protection:
#   - Enable Captcha protection -> [auth.captcha].enabled
#   - Provider / secret         -> [auth.captcha].provider/secret (verify env name)
#
# Authentication -> Rate Limits:
#   - Emails / Sign in+ups / Token refresh -> [auth.rate_limit].*
#
# Sessions / JWT (Project Settings or Auth):
#   - JWT expiry                -> [auth].jwt_expiry
#   - Refresh token rotation / reuse interval -> [auth].enable_refresh_token_rotation / refresh_token_reuse_interval
# ===========================================================================
